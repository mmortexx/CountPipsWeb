# Una vez por semana, una sola PR por ecosistema con todas las actualizaciones
# juntas: pasa por `comprobar.yml` como cualquier otra y no se fusiona sola.
# Los avisos de seguridad no dependen de este fichero: se activan en los
# ajustes del repositorio (Dependabot alerts y security updates).
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      dependencias:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      acciones:
        patterns: ["*"]
