name: Comprobar PR

# Las mismas barreras que `deploy.yml` corre antes de publicar, pero en cada PR:
# un fallo se ve aquí, antes de fusionar, y no en `main` con la web sin
# actualizar. No publica nada. `tests/comprobacion-pr.test.ts` falla si este
# fichero y `deploy.yml` dejan de correr las mismas comprobaciones.
on:
  pull_request:
  workflow_dispatch:

# Un push nuevo al mismo PR cancela la comprobación anterior, que ya no cuenta.
concurrency:
  group: comprobar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Solo lectura y sin secretos: el código de un PR no ha pasado ninguna revisión
# todavía. Sin las claves de los formularios el sitio se compila igual; esos
# formularios avisan del fallo en vez de enviar.
permissions:
  contents: read

jobs:
  comprobar:
    name: Puertas y humo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Mismo prefijo y misma dirección que la copia de GitHub Pages, para
    # compilar y recorrer el sitio tal como se publica.
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Comprobar tipos
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Pruebas
        run: bun run test

      - name: Build
        run: bun run build
        env:
          # Clave ficticia, no un secreto: con el formulario sin clave no hay
          # envío que recorrer y `teclado.mjs` no puede comprobar adónde va el
          # foco al enviar. Las auditorías interceptan Web3Forms: nada sale.
          NEXT_PUBLIC_WEB3FORMS_KEY: clave-ficticia-de-comprobacion

      - name: Comprobar el HTML compilado (prefijo y vocabulario)
        run: bunx vitest run tests/prefijo-despliegue.test.ts tests/vocabulario.test.ts

      # Las auditorías que leen `out/` sin navegador, como en `deploy.yml`.
      - name: Auditorías del HTML compilado
        run: node scripts/metadatos.mjs out && node scripts/enlaces.mjs out && node scripts/cifras.mjs out && node scripts/rotulos.mjs out && node scripts/equipaje.mjs out

      # La dirección oficial: canónico, mapa del sitio, robots y tarjetas
      # sociales en la dirección que pide el entorno, sin restos de otra.
      - name: Comprobar la dirección oficial
        run: COMPROBAR_OUT=1 bunx vitest run tests/dominio-propio.test.ts

      # Las pruebas que leen `out/`: en el paso «Pruebas» se saltan porque aún
      # no está compilado. Aquí, con `COMPROBAR_OUT=1`, sin `out/` fallan.
      - name: Pruebas sobre el sitio compilado (idiomas nuevos, formulario, acceso, tarjetas y política de contenido)
        run: COMPROBAR_OUT=1 bunx vitest run tests/idiomas-nuevos.test.ts tests/formulario-declarado.test.ts tests/acceso-enlazado.test.ts tests/tarjeta-seccion.test.ts tests/csp-pagina.test.ts

      - name: Instalar navegador de pruebas
        run: bunx playwright install --with-deps chromium

      - name: Comprobación de humo en navegador
        run: node scripts/humo.mjs --serve out

      - name: Zona táctil medida en móvil
        run: node scripts/toque.mjs --serve out

      # Foco, lo elegido e interruptores con el alto contraste de Windows, y
      # los diálogos y avisos recorridos con el teclado.
      - name: Alto contraste forzado
        run: node scripts/alto-contraste.mjs --serve out

      - name: Recorrido con teclado
        run: node scripts/teclado.mjs --serve out

      # La política de contenido de cada página (la única que tiene GitHub Pages)
      # y la de `_headers`, en los dos temas: nada de lo que el sitio usa, bloqueado.
      - name: Política de contenido
        run: node scripts/cabeceras.mjs --serve out

  # El sitio tal como se servirá en el dominio propio (Cloudflare Pages): en la
  # raíz, sin prefijo, y con la dirección oficial nueva. Nadie lo compila así
  # hasta el día del lanzamiento; aquí se compila en cada PR para que ese día
  # no aparezca un fallo que lleva semanas escondido.
  dominio:
    name: Dominio propio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://countpips.com
      # Clave de prueba pública que Cloudflare publica para Turnstile, no un
      # secreto: con ella el humo comprueba que /beta solo la carga al primer foco.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Comprobar la dirección oficial
        run: COMPROBAR_OUT=1 bunx vitest run tests/dominio-propio.test.ts

      - name: Instalar navegador de pruebas
        run: bunx playwright install --with-deps chromium

      - name: Comprobación de humo en navegador
        run: node scripts/humo.mjs --serve out

      - name: Zona táctil medida en móvil
        run: node scripts/toque.mjs --serve out

      # Las cabeceras de `public/_headers` solo las aplica Cloudflare: aquí se
      # recorre el sitio con ellas puestas para que la política de contenido no
      # bloquee nada por primera vez el día del lanzamiento.
      - name: Cabeceras de seguridad del dominio
        run: node scripts/cabeceras.mjs --serve out
