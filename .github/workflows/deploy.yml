name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permite que el job "pages" suba a GitHub Pages y que otros jobs no
# queden esperando. El deploy job se ejecuta aunque uno anterior falle
# porque queremos que cualquier build válido suba; los tests/lint, si
# los añadimos en el futuro, se ponen en un job separado con `needs`.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que se dispare un deploy cuando solo cambia el propio workflow.
# (No es crítico pero reduce builds inútiles.)
# Nota: usamos `paths-ignore` en lugar de `paths` para no romper si
# alguien añade archivos en la raíz.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PREFIJO DE RUTAS — declarado a nivel de JOB, no del paso de build.
    #
    # Estaba sólo en el `env:` del paso «Build», y ahí nació un fallo que
    # dejó el despliegue en rojo sin que nada estuviera mal en la página:
    # el sitio se compilaba pidiendo `/CountPipsWeb/_next/...` —porque
    # Pages lo publica en una subcarpeta— pero los pasos que lo recorren
    # con un navegador no veían la variable, servían la carpeta en la raíz
    # y recibían un 404 por cada hoja de estilos, cada script y cada
    # tipografía. Resultado: 163 fallos que describían una página sin
    # estilos —la barra montada sobre sí misma, contenido desbordando a lo
    # ancho, el cajón sin abrir— y ninguno era real. La comprobación que
    # existe para no publicar roto era justo lo que impedía publicar.
    #
    # A nivel de job lo heredan todos los pasos, así que el sitio se
    # construye y se comprueba con el MISMO prefijo. Y sigue estando
    # escrito una sola vez.
    env:
      # El nombre NO se escribe a mano: sale del propio repositorio.
      # Estaba fijo como "/JournalTradingWeb" y al renombrar el repo a
      # CountPipsWeb la web publicada siguió pidiendo sus estilos y sus
      # scripts a la ruta vieja — respondía 200 y se veía sin una sola
      # hoja de estilo. Derivándolo, un renombrado futuro no puede
      # volver a romperlo.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Barreras antes de publicar. Hasta ahora el despliegue sólo hacía
      # `build`, y con `typescript.ignoreBuildErrors: true` en next.config
      # eso significaba que NADA impedía publicar el sitio roto. Estos dos
      # pasos van antes del build a propósito: fallan rápido y con un
      # mensaje claro, en vez de dejar que el build produzca un sitio malo.
      - name: Comprobar tipos
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Tercera barrera. El proyecto no tenía NINGUNA prueba, y eso dejó
      # pasar durante meses cosas que una comprobación de tres líneas caza
      # al instante: el histograma de la portada con las pérdidas pintadas
      # de verde y las ganancias de rojo, el campo trampa antibot leyendo
      # un nombre que ningún cliente envía, y el límite de peticiones
      # abriéndose solo cuando falta su almacén. Las tres tienen ya su
      # prueba en `tests/`.
      - name: Pruebas
        run: bun run test

      - name: Build
        # El script `build` del package.json hace:
        #   next build && cp -R .next/static .next/standalone/.next/ && cp -R public .next/standalone/
        # `next build` con output:"export" (en producción) genera el
        # sitio estático en ./out/, que es lo que Pages sirve.
        # El paso `cp -R` solo es útil si ejecutas el server.js en
        # standalone; para Pages lo descartamos (los assets ya están
        # copiados a ./out/_next/ por el export).
        run: bun run build
        env:
          # PREFIJO DE RUTAS — solo para GitHub Pages.
          # Este sitio se publica en dos destinos: el dominio propio, en la
          # RAÍZ (Cloudflare Pages), y esta copia, que cuelga de un
          # subdirectorio con el nombre del repositorio. El prefijo se
          # declara en el `env:` del JOB (arriba) y en ningún sitio más:
          # `next.config.ts` no lo lleva escrito, así que sin él el sitio
          # se compila para la raíz — que es lo que necesitan el dominio
          # propio y el desarrollo local. Si se apaga esta publicación, se
          # borra aquella línea y no hay que tocar la configuración.
          #
          # Y la dirección pública de ESTA copia, por el mismo motivo: si
          # se queda apuntando a un nombre viejo, el canónico y la tarjeta
          # social señalan a una dirección que ya no existe.
          # El día que el dominio propio esté comprado y apuntando, se
          # cambia por él para que esta copia declare como canónica la
          # dirección buena — ver DESPLIEGUE.md.
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Destino de los formularios de contacto y boletín. Al ser un
          # sitio estático, Next incrusta el valor en el JS durante el
          # build: si el secret no está definido, el sitio se publica
          # igual pero los formularios avisan del fallo en vez de fingir
          # que han enviado. Se configura en:
          #   Settings → Secrets and variables → Actions → WEB3FORMS_KEY
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          # URL del script de Google de la lista. Mismo criterio: sin ella
          # el sitio se publica igual, pero el formulario de la lista avisa
          # del fallo en vez de fingir que ha registrado a nadie.
          #   Settings → Secrets and variables → Actions → WAITLIST_URL
          NEXT_PUBLIC_WAITLIST_URL: ${{ secrets.WAITLIST_URL }}
          # URL de POST /v1/applications del Worker services/beta-api. Sin
          # ella, joinBetaApplication cae al mismo Apps Script que la lista
          # de espera (ver src/lib/forms.ts) — el sitio se publica igual,
          # solo sin panel de operaciones ni deduplicación por D1.
          #   Settings → Secrets and variables → Actions → BETA_API_URL
          NEXT_PUBLIC_BETA_API_URL: ${{ secrets.BETA_API_URL }}
          # Clave pública de proyecto de PostHog (host EU). Sin ella,
          # PostHog.tsx no inyecta el script y el sitio se publica igual,
          # sin analítica.
          #   Settings → Secrets and variables → Actions → POSTHOG_KEY
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          # Site key pública de Turnstile. Sin ella, BetaApplication.tsx no
          # renderiza el widget anti-bot; el Worker igualmente rechaza la
          # solicitud si exige Turnstile y no llega turnstileToken.
          #   Settings → Secrets and variables → Actions → TURNSTILE_SITE_KEY
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

      # Cuarta barrera, y la única que mira la página PINTADA. Sirve el
      # export estático y lo recorre con un navegador de verdad en cuatro
      # anchuras, más una pasada con el JavaScript desactivado. Comprueba
      # el idioma declarado, que haya un solo titular y que sea visible
      # dentro de su presupuesto, que nada desborde a lo ancho, que la
      # consola esté limpia y que ningún elemento de la barra superior se
      # monte sobre otro.
      #
      # Es la que cazó que a 820 px la barra entera se solapaba consigo
      # misma — un fallo que llevaba ahí desde siempre y que ninguna
      # comprobación de código puede ver.
      # Las pruebas del paso «Pruebas» corren ANTES del build, así que las
      # que miran el HTML ya compilado se saltan solas allí — no existe
      # `out/` todavía. Aquí sí existe, y con el prefijo real puesto, que
      # es la única condición en la que esas comprobaciones significan
      # algo: en local se compila sin prefijo y no hay nada que exigir.
      #
      # Es lo que caza que una ruta interna se escriba desde la raíz del
      # dominio —el botón «Solicitar acceso anticipado» de la página de
      # precios daba 404 en producción por eso— o que el prefijo aparezca
      # dos veces, que es lo que dejó el sitio entero sin navegar el 11/08.
      - name: Comprobar el prefijo sobre el HTML compilado
        run: bunx vitest run tests/prefijo-despliegue.test.ts

      - name: Instalar navegador de pruebas
        run: bunx playwright install --with-deps chromium

      # `--serve out` levanta el sitio con un servidor propio de veinte
      # líneas dentro del propio script, así que este paso no depende de
      # ningún paquete que no esté ya en el proyecto.
      - name: Comprobación de humo en navegador
        run: node scripts/humo.mjs --serve out

      # Que cada sección dibuje un fondo distinto no lo vigila ninguna otra
      # cosa: `tests/atlas.test.ts` comprueba el guion declarado, y esto
      # comprueba lo que de verdad acaba en el canvas. Sin este paso, la
      # comprobación existiría y no protegería nada.
      - name: Comprobación del fondo por sección
        run: node scripts/fondos.mjs --serve out

      - name: Disable Jekyll + add nojekyll
        # GitHub Pages procesa el contenido con Jekyll por defecto.
        # Jekyll ignora directorios que empiezan por `_`, lo cual
        # rompería `_next/` (donde Next.js guarda sus assets). El
        # archivo `.nojekyll` en la raíz desactiva Jekyll y deja
        # que Pages sirva los archivos tal cual.
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
